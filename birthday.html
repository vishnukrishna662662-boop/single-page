<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      background: white;
      width: 320px;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    }

    h1 {
      color: #ff6f61;
      font-size: 2.4em;
      margin-bottom: 10px;
    }

    .emoji {
      font-size: 4em;
      margin: 15px 0;
    }

    p {
      color: #555;
      font-size: 1.1em;
      margin: 10px 0;
    }

    .from {
      margin-top: 20px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Happy Birthday krishna!</h1>
    <div class="emoji">🎉🎂🎉</div>
    <p>
      Wishing you a day full of happiness, laughter, and sweet surprises.
    </p>
    <p class="from">
      — Best Wishes 💖
    </p>
  </div>

</body>
</html>
